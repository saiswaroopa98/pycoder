services:
  postgres:
    image: postgres:16-alpine
    container_name: assignment-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ingestion
    ports:
      - "5434:5432"
    volumes:
      - assignment_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - assignment-network

  ingestion:
    build: ./packages/ingestion
    container_name: assignment-ingestion
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/ingestion
      API_BASE_URL: http://datasync-dev-alb-101078500.us-east-1.elb.amazonaws.com
      API_KEY: ds_c073c1205c239fd07cbbe25b098dd224
      BATCH_SIZE: 1000
      LOG_LEVEL: info
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - assignment-network
    volumes:
      - ./output:/app/output

volumes:
  assignment_postgres_data:

networks:
  assignment-network:
    driver: bridge